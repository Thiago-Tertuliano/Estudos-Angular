<div class="login-page">
  <div class="card">
    <h1>ProjControl</h1>
    <p class="subtitle">Gestão de projetos — controle de status, prazos e equipe</p>

    @if (sessionExpired) {
      <p class="banner">Sessão expirada. Faça login novamente.</p>
    }

    <app-login-form
      [loading]="loading()"
      [error]="error()"
      (submitForm)="onSubmit($event)"
    />

    <p class="hint">Demo: qualquer e-mail válido + senha com 3+ caracteres</p>
  </div>
</div>
